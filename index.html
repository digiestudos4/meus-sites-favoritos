
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <!-- Define a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Permite adaptação para celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece na aba do navegador -->
    <title>Meus sites favoritos</title>

    <!-- Estilo visual da página -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #243b64;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .site {
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 8px #cccccc;
        }

        .site img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Título principal da página -->
    <h1>Meus sites favoritos: Digiani Cristina </h1>

    <p>Confira abaixo meus cinco sites favoritos!</p>

    <!-- Área que contém os cinco sites -->
    <div class="container">

        <!-- Primeiro site: YouTube -->
        <div class="site">
            <h2>YouTube</h2>
            <img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="Logo YouTube">
            <p><a href="https://www.youtube.com" target="_blank">Acessar YouTube</a></p>
        </div>

        <!-- Segundo site: Google -->
        <div class="site">
            <h2>Google</h2>
            <img src="https://www.google.com/s2/favicons?domain=google.com&sz=128" alt="Logo Google">
            <p><a href="https://www.google.com" target="_blank">Acessar Google</a></p>
        </div>

        <!-- Terceiro site: Instagram -->
        <div class="site">
            <h2>Instagram</h2>
            <img src="https://www.google.com/s2/favicons?domain=instagram.com&sz=128" alt="Logo Instagram">
            <p><a href="https://www.instagram.com" target="_blank">Acessar Instagram</a></p>
        </div>

        <!-- Quarto site: Wikipedia -->
        <div class="site">
            <h2>Wikipedia</h2>
            <img src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128" alt="Logo Wikipedia">
            <p><a href="https://www.wikipedia.org" target="_blank">Acessar Wikipedia</a></p>
        </div>

        <!-- Quinto site: Canva -->
        <div class="site">
            <h2>Canva</h2>
            <img src="https://www.google.com/s2/favicons?domain=canva.com&sz=128" alt="Logo Canva">
            <p><a href="https://www.canva.com" target="_blank">Acessar Canva</a></p>
        </div>

    </div>

</body>
</html>
